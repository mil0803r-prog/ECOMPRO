<!doctype html><meta charset="utf-8"><title>ECOMPRO</title>
<style>body{font:14px system-ui,sans-serif;width:340px;margin:0;padding:14px;color:#0b2230}h1{font-size:17px;margin:0 0 2px;letter-spacing:.06em}.hd{display:flex;gap:10px;align-items:center}.hd img{border-radius:10px}label{display:block;font-weight:600;margin:10px 0 3px;font-size:12px}input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #b9cdd8;border-radius:8px}button{margin-top:10px;padding:8px 12px;border:0;border-radius:8px;background:#0e7aa8;color:#fff;font-weight:700;cursor:pointer}button#u{background:#f97316}button.s{background:#e3eef4;color:#0b2230}#st{margin-top:12px;padding:8px;border-radius:8px;background:#eef5f9;font-size:12px;line-height:1.4;word-break:break-word}.ok{color:#15803d}.no{color:#b91c1c}small{color:#4b6676}</style>
<div class="hd"><img src="icon-48.png" width="40" height="40" alt="ECOMPRO"><div><h1>ECOMPRO</h1><small>Dropi en vivo · tus pedidos se mandan solos a tu tablero con Dropi abierto.</small></div></div>
<label for="b">Dirección de tu tablero</label><input id="b" type="url" placeholder="https://ecompro-iota.vercel.app">
<label for="k">Clave (la misma de DROPI_LIVE_KEY en Vercel)</label><input id="k" type="password" autocomplete="off" placeholder="Pega tu clave">
<button id="g">Guardar</button> <button id="p" class="s">Probar conexión</button>
<label for="a">Recargar Dropi automáticamente (solo si ya tienes Dropi abierto)</label>
<select id="a"><option value="0">No, solo cuando yo lo pida</option><option value="5">Cada 5 minutos</option><option value="10">Cada 10 minutos</option><option value="15">Cada 15 minutos</option><option value="30">Cada 30 minutos</option></select>
<button id="u">Actualizar ahora</button>
<div id="st">Sin datos todavía.</div>
<button id="d" class="s">Copiar diagnóstico (sin datos personales)</button>
<script src="popup.js"></script>
